# 把網站檔案發布到 GitHub Pages
# 每次 push 到 main 就自動跑；也可以在 Actions 頁面手動按 Run workflow
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 只給這支流程「讀程式碼」和「發布網站」兩種權限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一時間只跑一次發布；新的 push 進來時，等舊的跑完，不強行打斷
concurrency:
  group: pages-custom
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5

      # 只發布網站用得到的檔案（資料庫、程式、說明文件不放上網站）。index.html 引用了清單以外的檔案時，這一步會失敗提醒
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html style.css theme.js i18n.js app.js analysis.js _site/
          cp -r data _site/
          python3 -c "import os, re, sys; h = open('_site/index.html', encoding='utf-8').read(); miss = [u for u in re.findall(r'(?:src|href)=\"([^\"#:]+)\"', h) if not os.path.exists(os.path.join('_site', u))]; sys.exit('網站少了檔案：%s' % miss if miss else 0)"

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # 打包檔上傳後，GitHub 要過幾秒才查得到；太快去部署會報 "No artifacts named github-pages"（2026-11-22 連續失敗），所以先等一下
      - name: Wait for the artifact to register
        run: sleep 30

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
