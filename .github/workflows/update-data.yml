# 每天自動更新資料：從 ESPN 抓最新比分、賽程、盤口、傷病名單，整理成網頁資料，有變動就 commit 回 main，再觸發網站發布。
# 等於把 README 裡「更新資料」那兩行指令（fetch_espn_games.py、build_data.py）交給 GitHub 自己跑。
# 也可以在 Actions 頁面手動按 Run workflow（想立刻更新時用）。
name: Update data

on:
  schedule:
    # 時間是 UTC（台灣時間 = UTC + 8）。一天 14 次（原本 4 次）：
    #   台灣 02:45 ~ 14:45 每小時一次（13 次，涵蓋美國賽前、比賽進行中、打完後），加上台灣 23:45 一次；
    #   台灣 14:50 ~ 隔天 02:40 只跑 23:45 那一次（這段時間沒有比賽，只需要更新一次下一輪的盤口和傷病名單）。
    #   UTC 對照：台灣 02:45 ~ 14:45 = UTC 18:45 ~ 06:45；台灣 23:45 = UTC 15:45
    # 為什麼：
    #   1. 開賽前最後一次更新的傷病名單，就是那場「賽前凍結」的扣分；越接近開賽，名單越準（球隊通常開賽前 1~2 小時才公布誰出賽）
    #   2. 賭盤勝率條是「某一次更新時」的賠率：更新越密，抓到的賠率越新
    #   3. 比賽打完後比分、準確率更新得越快
    # GitHub 的排程常常延遲十幾分鐘甚至更久；刻意用 :45 避開整點和半點（那時候最塞）
    # 同一時間只跑一次（見下面的 concurrency），延遲太久而疊在一起的更新會排隊，不會同時 push 打架
    - cron: "45 0-6,15,18-23 * * *"
  workflow_dispatch:

# 要 commit 資料回 repo（contents: write），並手動叫發布流程跑一次（actions: write）。
# 用內建的 GITHUB_TOKEN push 不會自動觸發別的流程，所以最後一步要自己叫 pages.yml。
permissions:
  contents: write
  actions: write

# 同一時間只跑一次，避免兩次更新同時 push 打架
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # 只在例行賽期間自動跑（季前、季後不跑）。例行賽結束後要改成「整季完成」模式，見 README「球季結束後」
      - name: Check season window
        id: window
        run: |
          today=$(date -u +%F)
          if [[ "$today" < "2026-10-20" || "$today" > "2027-04-20" ]]; then
            echo "$today 不在例行賽期間，這次不更新"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.window.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 兩支程式只用 Python 內建的套件，不用另外安裝
      - name: Fetch latest data from ESPN
        if: steps.window.outputs.skip != 'true'
        run: python fetch_espn_games.py

      - name: Build site data
        if: steps.window.outputs.skip != 'true'
        run: python build_data.py

      # 記錄「防守進步的受讓隊」符合規則的比賽、打完補結果（只能新增，見 dog_log.py）；寫進 db/dog_log.db，下面 commit 時一起帶上
      # 這步壞了不要擋住資料更新，所以失敗也繼續
      - name: Record qualifying underdog games
        id: doglog
        if: steps.window.outputs.skip != 'true'
        continue-on-error: true
        run: python dog_log.py

      - name: Warn if the underdog log failed
        if: steps.doglog.outcome == 'failure'
        run: echo "::warning::冷門紀錄簿（dog_log.py）這次執行失敗，其他資料照常更新"

      - name: Commit changes
        id: commit
        if: steps.window.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 更新資料的這幾分鐘裡如果有人 push 了新的程式：改用新程式重新產生一次，不拿舊程式的結果蓋上去
          git fetch -q origin main
          if ! git diff --quiet HEAD origin/main -- '*.py'; then
            echo "::warning::更新途中程式有新版本，用新版重新產生網頁資料"
            git checkout -q -- data
            stashed=""
            if ! git diff --quiet -- db; then git stash push -q -- db; stashed=1; fi
            git merge -q --ff-only origin/main
            if [ -n "$stashed" ]; then git stash pop -q; fi
            python build_data.py
            python dog_log.py || echo "::warning::dog_log.py 失敗"
          fi
          # 資料庫檔壞掉就不要 commit 上去
          python -c "import sqlite3, sys; bad = [p for p in ('db/nba.db', 'db/dog_log.db') if sqlite3.connect(p).execute('PRAGMA integrity_check').fetchone()[0] != 'ok']; sys.exit('資料庫完整性檢查失敗：%s' % bad if bad else 0)"
          git add db data
          if git diff --cached --quiet; then
            echo "資料沒有變動，不 commit"
            exit 0
          fi
          git commit -m "data: auto update $(date -u +'%Y-%m-%d %H:%M') UTC"
          # 這段時間如果有人（你）也 push 了，先接上最新的再 push
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            if gh workflow run pages.yml --ref main; then exit 0; fi
            echo "::warning::觸發網站發布失敗（第 $i 次），30 秒後再試"
            sleep 30
          done
          exit 1
